# ─────────────────────────────────────────────────────────────
#  TAGS — the coloured labels used on experience, education and hobby items.
#  In an item's front matter write:   tags: [hobby, federated]
#  To create a new tag: add it here (key, en, pt, color) and use the key.
#
#  colors: blue | green | amber | rose | violet | teal | slate
# ─────────────────────────────────────────────────────────────

