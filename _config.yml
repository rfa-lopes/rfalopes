# ─────────────────────────────────────────────────────────────
#  Site settings  (the content you edit lives in /admin — see admin/README.md)
# ─────────────────────────────────────────────────────────────
title: Rodrigo Lopes
description: Software Engineer and founder of Hockeyfy. Experience, education, skills and projects.
baseurl: "/rfalopes"                   # the subpath of the site
url: "https://rfa-lopes.github.io"     # the base hostname & protocol
lang: en
timezone: Europe/Lisbon

# Everything editable lives inside /admin
collections_dir: admin      # admin/_experience, admin/_education, admin/_hobbies
data_dir: admin/_data       # admin/_data/*.yml (profile, contacts, skills, ...)

collections:
  experience:
    output: true
    permalink: /experience/:name/
  education:
    output: true
    permalink: /education/:name/
  hobbies:
    output: true
    permalink: /hobbies/:name/

defaults:
  - scope: { path: "", type: experience }
    values: { layout: detail }
  - scope: { path: "", type: education }
    values: { layout: detail }
  - scope: { path: "", type: hobbies }
    values: { layout: detail }

plugins:
  - jekyll-sitemap

# Analytics (only loaded on the published site, never on a local preview)
google_tracking_id: G-8CDPS3ZJPS

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - admin/README.md
  - images/README.md
  - tools
  - _site-test
  - vendor
  - .bundle
  - .idea
  - node_modules
