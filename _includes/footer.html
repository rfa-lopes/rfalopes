<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }} · {% include t.html k="updated" %} {{ site.time | date: "%d/%m/%Y" }}</p>
    <ul class="social" aria-label="Social">
      {%- for c in site.data.contacts -%}
      {%- if c.hero and c.show != false and c.url != '' %}
      <li><a href="{{ c.url }}"{% unless c.url contains 'mailto:' %} target="_blank" rel="noopener"{% endunless %} aria-label="{{ c.label.en }}">{% include icon.html name=c.icon %}</a></li>
      {%- endif -%}
      {%- endfor %}
    </ul>
    <a class="footer-badge" target="_blank" rel="noopener" href="https://www.zaask.pt/user/rfalopes"><img src="https://www.zaask.pt/widget?user=994952&widget=pro-findme" alt="Zaask" /></a>
  </div>
</footer>
