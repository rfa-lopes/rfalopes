<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="dark">
{% include head.html %}
<body class="page-{{ page.nav | default: page.collection | default: 'home' }}">
  <a class="skip-link" href="#main">{% include t.html k="skip" %}</a>
  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button class="lightbox-close icon-btn" type="button" aria-label="Close">{% include icon.html name="x" %}</button>
    <figure>
      <img src="" alt="">
      <figcaption></figcaption>
    </figure>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
